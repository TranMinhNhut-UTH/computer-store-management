server:
  port: 5080

spring:
  application:
    name: computer-store-backend

  datasource:
    url: "jdbc:mysql://localhost:3306/computer_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    issuer: ComputerStore
    audience: ComputerStoreClients
    key: ${JWT_KEY:}                 # bắt buộc, tối thiểu 32 ký tự
    access-token-minutes: 15
  cors:
    origins: http://localhost:5173,http://localhost:3000
  seed:
    admin-email: admin@computerstore.local
    admin-password: ${ADMIN_PASSWORD:}   # để trống = không tạo tài khoản Quản lý mặc định
